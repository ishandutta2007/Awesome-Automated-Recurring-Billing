<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.75; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(0.9) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPillDelayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes shimmer {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .orb-purple {
      transform-origin: 950px 100px;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .orb-cyan {
      transform-origin: 150px 320px;
      animation: pulseOrb2 9s ease-in-out infinite;
    }
    .rotating-ring {
      transform-origin: 1040px 210px;
      animation: rotateRing 20s linear infinite;
    }
    .rotating-ring-reverse {
      transform-origin: 1040px 210px;
      animation: rotateRing 30s linear infinite reverse;
    }
    .flowing-flow {
      stroke-dasharray: 8 6;
      animation: dashFlow 4s linear infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillDelayed 6s ease-in-out infinite 0.5s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPillDelayed 6.5s ease-in-out infinite 1.5s; }
    .shimmer-dot { animation: shimmer 2s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic / Animated Glow Orbs in Deep Background -->
  <g>
    <circle class="orb-purple" cx="950" cy="100" r="180" fill="#818cf8" filter="url(#glow)" opacity="0.4" />
    <circle class="orb-cyan" cx="150" cy="320" r="160" fill="#06b6d4" filter="url(#glow)" opacity="0.3" />
    <circle cx="1060" cy="340" r="130" fill="#ec4899" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Right-hand Interactive / Animated Billing Flow Diagram Visuals (Background decor) -->
  <g opacity="0.75">
    <!-- Concentric Rotating Cycle Rings representing Recurring Engine -->
    <circle class="rotating-ring" cx="1040" cy="210" r="120" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.6" />
    <circle class="rotating-ring-reverse" cx="1040" cy="210" r="95" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.5" />
    <circle cx="1040" cy="210" r="70" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Central Recurring Symbol icon in ring -->
    <path d="M 1025 210 A 15 15 0 1 1 1055 210 A 15 15 0 0 1 1025 210" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
    <polygon points="1055,204 1061,211 1051,213" fill="#ec4899" />
    <polygon points="1025,216 1019,209 1029,207" fill="#6366f1" />

    <!-- Connecting Dynamic Flow Line -->
    <path class="flowing-flow" d="M 760 140 C 850 140, 890 200, 945 205" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
    <path class="flowing-flow" d="M 780 280 C 860 280, 890 220, 945 215" fill="none" stroke="url(#cyanGrad)" stroke-width="2" />
  </g>

  <!-- Floating Dynamic Feature Badges / Pills (Decorations on the Right) -->
  <g class="pill-1">
    <rect x="740" y="70" width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle class="shimmer-dot" cx="762" cy="91" r="5" fill="#10b981" />
    <text x="778" y="96" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">Automated Invoicing</text>
  </g>

  <g class="pill-2">
    <rect x="770" y="130" width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle class="shimmer-dot" cx="792" cy="151" r="5" fill="#38bdf8" />
    <text x="808" y="156" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">Usage Metering</text>
  </g>

  <g class="pill-3">
    <rect x="760" y="250" width="195" height="42" rx="21" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle class="shimmer-dot" cx="782" cy="271" r="5" fill="#ec4899" />
    <text x="798" y="276" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">Smart Dunning &amp; Tax</text>
  </g>

  <g class="pill-4">
    <rect x="790" y="310" width="175" height="42" rx="21" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle class="shimmer-dot" cx="812" cy="331" r="5" fill="#f59e0b" />
    <text x="828" y="336" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">Revenue Lifecycle</text>
  </g>

  <!-- FOREGROUND TEXT SECTION (Left aligned, high contrast, clean hierarchy, never obscured) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <rect x="0" y="65" width="235" height="30" rx="15" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="16" y="85" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">⚡ AWESOME RECURRING BILLING</text>

    <!-- Main Title -->
    <text x="0" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">
      Automated Recurring
    </text>
    <text x="0" y="210" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">
      Billing Ecosystem
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
      Curated directory of high-scale SaaS platforms &amp; open-source billing engines.
    </text>
    <text x="0" y="288" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
      Subscription lifecycle • Real-time event metering • Dunning • Revenue recognition
    </text>

    <!-- Interactive stats / highlights row -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">10 SaaS Titans</text>

      <rect x="142" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="156" y="22" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">10 Open Source</text>

      <rect x="299" y="0" width="125" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="313" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">100% Curated</text>
    </g>
  </g>
</svg>
